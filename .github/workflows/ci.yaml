
# CI for Product Catalog Service

name: product-catalog-ci

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.9'
          cache-dependency-path: src/product-catalog/go.sum

      - name: Build
        working-directory: src/product-catalog
        run: |
          go mod download
          go build -o product-catalog-service main.go

      - name: Unit tests
        working-directory: src/product-catalog
        run: go test ./...

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.9'
          cache: false

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          working-directory: src/product-catalog
          args: --timeout=5m
          skip-cache: true

  docker:
    runs-on: ubuntu-latest

    needs:
      - build
      - code-quality

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Docker Build and Push
        uses: docker/build-push-action@v6
        with:
          context: src/product-catalog
          file: src/product-catalog/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{ github.run_id }}
            ${{ secrets.DOCKER_USERNAME }}/product-catalog:latest

  updatek8s:
    runs-on: ubuntu-latest

    needs: docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update tag in Kubernetes deployment manifest
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ github.run_id }}
        run: |
          sed -i "s|image: .*product-catalog:.*|image: ${DOCKER_USERNAME}/product-catalog:${IMAGE_TAG}|" kubernetes/productcatalog/deploy.yaml

      - name: Commit and push changes
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add kubernetes/productcatalog/deploy.yaml
          git commit -m "[CI] Update product catalog image tag [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main
